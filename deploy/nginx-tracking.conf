# nginx — tracking.fabrica77.com.br → lab77-webhook (127.0.0.1:3010)
#
# EXEMPLO — não aplicar automatizado; nginx na VPS é mexido junto com o Sergio.
# Instalação manual:
#   1. copiar pra /etc/nginx/sites-available/tracking.fabrica77.com.br
#   2. ln -s ../sites-available/tracking.fabrica77.com.br /etc/nginx/sites-enabled/
#   3. nginx -t && systemctl reload nginx
#   4. certbot --nginx -d tracking.fabrica77.com.br   (adiciona o bloco 443/TLS)
#
# Pré-requisito: DNS A tracking.fabrica77.com.br → 72.60.154.208

# Rate limit pros endpoints públicos (etiqueta tem PII — nome/endereço do
# cliente no PDF — e cada cache-miss dispara chamadas Bling+FreteBarato).
# A zona precisa estar no contexto http{} — se este arquivo for incluído via
# sites-enabled, já está.
limit_req_zone $binary_remote_addr zone=tracking_pub:10m rate=30r/m;

server {
    listen 80;
    server_name tracking.fabrica77.com.br;

    # (certbot converte pra redirect 301 → https e cria o server 443)

    access_log /var/log/nginx/tracking.access.log;
    error_log  /var/log/nginx/tracking.error.log;

    # ── Endpoints administrativos: NUNCA expostos na internet ──────────────
    # (têm API key, mas defesa em profundidade — Sergio acessa da própria VPS
    # via curl http://127.0.0.1:3010/...)
    location ~ ^/(export-tokens|reprocessar|etiquetas$|fila|api/) {
        return 404;
    }

    # ── Webhook do Bling (HMAC verificado pela app via rawBody) ────────────
    location /webhook/bling {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Não bufferizar/alterar o body — o HMAC é calculado sobre o raw body
        proxy_request_buffering off;
    }

    # ── OAuth (Sergio autoriza pelo navegador) ─────────────────────────────
    location ~ ^/(authorize|oauth/callback) {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Painel da expedição ────────────────────────────────────────────────
    # PENDENTE (decisão Sergio): proteger com basic auth? Hoje lista nome de
    # cliente + valor de ~2000 NFs publicamente. Pra ativar:
    #   htpasswd -c /etc/nginx/.htpasswd-tracking expedicao
    # e descomentar as 2 linhas auth_basic abaixo.
    location /painel {
        # auth_basic "Painel LAB77";
        # auth_basic_user_file /etc/nginx/.htpasswd-tracking;
        limit_req zone=tracking_pub burst=10 nodelay;
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Etiquetas (público por design — o frontend usa etiqueta_url como
    #    backup; o f77-backend consome por DENTRO via f77-net, não por aqui) ─
    location /etiqueta/ {
        limit_req zone=tracking_pub burst=20 nodelay;
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Health (monitoramento) ─────────────────────────────────────────────
    location = /health {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
    }

    # Qualquer outra rota: não existe pra internet
    location / {
        return 404;
    }
}
